name: Web app (iPhone)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Build
        run: |
          flutter pub get
          flutter build web --release --base-href /${{ github.event.repository.name }}/ --no-web-resources-cdn
          # cache-busting: a new build is fetched right away instead of the
          # browser's copy of the old app
          V=${GITHUB_SHA::8}
          sed -i "s#\"mainJsPath\":\"main.dart.js\"#\"mainJsPath\":\"main.dart.js?v=$V\"#" build/web/flutter_bootstrap.js
          sed -i "s#flutter_bootstrap.js\"#flutter_bootstrap.js?v=$V\"#" build/web/index.html
          grep -q "main.dart.js?v=$V" build/web/flutter_bootstrap.js
          touch build/web/.nojekyll

      - name: Publish to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true
