name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test --exclude-tags screenshots

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.GOFTARIN_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "GOFTARIN_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secret; building with the debug key."
          fi

      - name: Build APK
        env:
          GOFTARIN_KEYSTORE_PASSWORD: ${{ secrets.GOFTARIN_KEYSTORE_PASSWORD }}
          GOFTARIN_KEY_ALIAS: goftarin
        run: |
          flutter build apk --release --build-number=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk goftarin-0.1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: goftarin-apk
          path: goftarin-*.apk

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: گفتارین ۰٫۱.${{ github.run_number }} (آزمایشی)
          prerelease: true
          files: goftarin-*.apk
          body: |
            نسخه‌ی آزمایشی برای تست روی گوشی اندروید.
            فایل APK را دانلود و نصب کنید.
